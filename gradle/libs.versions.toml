# Satu-satunya sumber kebenaran versi dependensi & plugin (lihat AGENTS.md §4).
[versions]
agp = "9.4.0"
compileSdk = "36"
targetSdk = "36"
minSdk = "24"
appcompat = "1.8.0"
activity = "1.9.3"
wireguardTunnel = "1.0.20260102"
securityCrypto = "1.1.0"
junit = "4.13.2"
json = "20260814"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
wireguard-tunnel = { module = "com.wireguard.android:tunnel", version.ref = "wireguardTunnel" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
# Hanya untuk pengujian unit JVM (tidak ikut ke APK).
junit = { module = "junit:junit", version.ref = "junit" }
# org.json di android.jar bisa jadi rintisan di unit test JVM; pakai
# implementasi nyata KHUSUS untuk pengujian (tidak ikut ke APK).
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
