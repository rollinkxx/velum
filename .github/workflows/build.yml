name: build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Log tidak bisa dibaca dari sandbox agen (EOF): teruskan error ke anotasi.
      - name: Laporkan error kompilasi sebagai anotasi
        if: always()
        run: python3 .github/scripts/anotasikan-log.py "$RUNNER_TEMP/build.log"

      - name: Ringkasan (fallback log)
        if: always()
        run: |
          {
            echo "## Hasil build"
            echo "- Status: ${{ job.status }}"
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "- APK: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Pengujian unit murni JVM (tanpa emulator): logika VelumFormat & keputusan uji.
  # Pemblokir — mencegah regresi logika seperti false negative "Belum lewat Velum".
  unitTest:
    name: unitTest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pengujian unit
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Kegagalan tes hanya ada di laporan JUnit; tanpa ini job merah tanpa informasi.
      - name: Laporkan kegagalan tes sebagai anotasi
        if: always()
        run: |
          python3 .github/scripts/anotasikan-tes.py
          python3 .github/scripts/anotasikan-log.py "$RUNNER_TEMP/test.log"

      - name: Unggah laporan pengujian
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

  # Pemeriksaan lint Android — ADVISORI (continue-on-error): tidak memblokir merge,
  # hasilnya dibaca dari artifact laporan bila perlu dibersihkan.
  lint:
    name: lint (advisori)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint debug
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Tampilkan temuan lint
        if: always()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            tail -n 150 app/build/reports/lint-results-debug.txt
            {
              echo "## Temuan lint"
              echo '```'
              tail -n 150 app/build/reports/lint-results-debug.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unggah laporan lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  # Job rilis OPSIONAL (TODO 8): hanya jalan bila maintainer menyiapkan
  # Secrets SIGNING_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
  # dan variable repository ENABLE_RELEASE_SIGNING=true. Tanpa itu job di-skip.
  release:
    name: assembleRelease (bertanda tangan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, unitTest]
    if: vars.ENABLE_RELEASE_SIGNING == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialisasi keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK bertanda tangan
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Unggah APK rilis
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
