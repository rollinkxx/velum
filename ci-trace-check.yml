name: trace-check
on:
  push:
    branches: [ 'arena/01a09481-velum' ]
permissions:
  contents: read
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Uji unit kelas alur uji (tanpa Android SDK)
        shell: bash
        run: |
          set -euo pipefail
          KOTLINC_VER=2.0.21
          curl -sSL -o kotlinc.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLINC_VER}/kotlin-compiler-${KOTLINC_VER}.zip"
          unzip -q kotlinc.zip
          mkdir -p out/tmp
          SRC="app/src/main/java/com/rollinkxx/velum"
          TST="app/src/test/java/com/rollinkxx/velum"
          ./kotlinc/bin/kotlinc \
            -jvm-target 17 -nowarn \
            -d out/tmp/vl.jar \
            "$SRC/VelumFormat.kt" "$SRC/VelumTestResult.kt" "$SRC/VelumTestDecision.kt" \
            "$TST/VelumTestDecisionTest.kt" "$TST/VelumTestResultTest.kt"
          curl -sSL -o junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          java -cp out/tmp/vl.jar:junit.jar:hamcrest.jar org.junit.runner.JUnitCore \
            com.rollinkxx.velum.VelumTestDecisionTest \
            com.rollinkxx.velum.VelumTestResultTest
